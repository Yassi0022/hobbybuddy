
spring.application.name=hobbybuddy-platform

# Server port (Render injects PORT env var)
server.port=${PORT:8080}

# MySQL database configuration (env vars for cloud, fallback for local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hobbybuddy_db?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Cloud Optimization (Aiven/Render)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=HobbyBuddyHikariPool

spring.thymeleaf.cache=false

# FastAPI URL (env var for cloud, fallback for local)
fastapi.url=${FASTAPI_URL:http://localhost:8001}

# JWT signing key (base64-encoded, min 256 bits / 32 bytes)
# Generate with: openssl rand -base64 32
# Set via environment variable JWT_SECRET — NOT stored here.

# Server error details
server.error.include-message=always
server.error.include-stacktrace=always

# Forward headers for Render proxy (WebSocket support)
server.forward-headers-strategy=native

# Ticketmaster Discovery API (backend-only, never exposed to frontend)
# Get a free key at: https://developer.ticketmaster.com/
ticketmaster.api.key=${TICKETMASTER_API_KEY:}

# ── Cache configuration ──
# External events cache TTL in seconds (30 minutes)
cache.external-events.ttl=1800
# Event listings cache TTL in seconds (5 minutes)
cache.event-listings.ttl=300
# Location resolve cache TTL in seconds (60 minutes)
cache.location-resolve.ttl=3600