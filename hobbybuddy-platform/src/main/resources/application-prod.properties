# Production profile – Aiven MySQL + Render

# Server binding: Render dynamically assigns PORT; must use their value, not a hardcoded one.
# server.address ensures binding on all interfaces behind Render's reverse proxy.
server.port=${PORT:8080}
server.address=0.0.0.0

# Aiven provides the MySQL connection string via environment variables.
# Example: jdbc:mysql://<host>:<port>/<db>?ssl-mode=REQUIRED&useSSL=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Use the MySQL dialect appropriate for Aiven (compatible with MySQL 8)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Disable automatic schema generation – Flyway will manage migrations
spring.jpa.hibernate.ddl-auto=none

# Flyway: baseline on migrate for existing production schemas
spring.flyway.baseline-on-migrate=true

# Connection pool settings (same as default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
