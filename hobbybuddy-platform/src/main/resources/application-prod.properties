# Production profile – Aiven MySQL + Render

# Server binding: Render dynamically assigns PORT; must use their value, not a hardcoded one.
# server.address ensures binding on all interfaces behind Render's reverse proxy.
server.port=${PORT:8080}
server.address=0.0.0.0

# Forward headers for Render reverse proxy (X-Forwarded-For, X-Forwarded-Proto)
server.forward-headers-strategy=native

# --- JPA / Hibernate ---
# Use the MySQL dialect appropriate for Aiven (compatible with MySQL 8)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Disable automatic schema generation – Flyway will manage migrations
spring.jpa.hibernate.ddl-auto=none

# OSIV is anti-pattern in production — disable to avoid lazy-loading N+1 and
# accidental DB calls outside @Transactional boundaries
spring.jpa.open-in-view=false

# Suppress JPA/Hibernate noise in prod logs
spring.jpa.show-sql=false

# Flyway: baseline on migrate for existing production schemas
spring.flyway.baseline-on-migrate=true

# --- Database (Aiven MySQL) ---
# Aiven provides the MySQL connection string via environment variables.
# Example: jdbc:mysql://<host>:<port>/<db>?ssl-mode=REQUIRED&useSSL=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

# --- Error handling ---
# Never leak stack traces or internal details in production error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Thymeleaf ---
# Not used in production (SPA serves static build from frontend_v2).
# Disabling eliminates the "template location not found" warning.
spring.thymeleaf.enabled=false

# --- Email (SMTP) ---
# Master switch: set to "true" to require SMTP and warn on misconfiguration.
# When "false" (default), missing SMTP env vars → NoOpMailSender, app starts fine.
app.email.enabled=false
