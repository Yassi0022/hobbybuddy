# Test profile – H2 in-memory, Flyway disabled, JWT secret fixed

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

# Fixed JWT secret for tests (base64-encoded 32-byte key)
JWT_SECRET=dGVzdC1zZWNyZXQtZm9yLWp3dC10ZXN0aW5nLXB1cnBvc2VzLW9ubHk=

# Email is controlled by EmailConfig via EMAIL_HOST env var.
# In tests EMAIL_HOST is not set → fallback NoOpMailSender is active.
# Do NOT set spring.mail.* properties — they would trigger Spring Boot's
# MailSenderAutoConfiguration and conflict with our custom EmailConfig.

# Disable email verification gate in tests — auto-verify users on registration.
# This mirrors the current prod config while email delivery is being migrated.
app.email.verification.required=false
