services:
  # ── Service 1: Spring Boot web app (Java) ──────────────────────────────────
  - type: web
    name: hobbybuddy
    runtime: java
    buildCommand: cd frontend_v2 && npm install && npm run build && cp -r dist/* ../hobbybuddy-platform/src/main/resources/static/ && cd ../hobbybuddy-platform && mvn package -DskipTests
    startCommand: java -jar hobbybuddy-platform/target/demo-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_FROM
        value: "noreply@hobbybuddy.com"
      - key: FASTAPI_URL
        fromService:
          type: web
          name: hobbybuddy-matching
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /api/health
    plan: free

  # ── Service 2: Python matching engine (FastAPI) ────────────────────────────
  - type: web
    name: hobbybuddy-matching
    runtime: docker
    dockerfilePath: matching-engine/Dockerfile
    envVars:
      - key: PORT
        value: 8001
    healthCheckPath: /health
    plan: free
