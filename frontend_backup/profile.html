<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - HobbyBuddy</title>
    <link rel="stylesheet" href="/css/hobbybuddy.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #fafafa; color: #334155; }
        .profile-page { max-width: 800px; margin: 40px auto; padding: 20px; }
        .glass-panel { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .btn-back { margin-bottom: 24px; display: inline-flex; align-items: center; gap: 8px; color: #6366f1; text-decoration: none; font-weight: 600; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 700; color: #0F172A; margin-bottom: 8px; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1rem; }
        .hobbies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        .hobby-chip { padding: 10px; border: 1px solid #e2e8f0; border-radius: 100px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
        .hobby-chip.selected { background: #6366f1; color: white; border-color: #6366f1; }
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .photo-input { background: #f8fafc; padding: 15px; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="profile-page">
        <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        
        <div class="glass-panel">
            <h1 style="margin-top:0; color:#0F172A;">Edit Your Profile</h1>
            <p style="color:#64748b; margin-bottom:40px;">Craft your identity for the community.</p>

            <form id="profile-edit-form">
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="edit-name" required placeholder="What should we call you?">
                </div>

                <div class="form-group">
                    <label>One-liner Tagline</label>
                    <input type="text" id="edit-tagline" placeholder="e.g. Photography enthusiast & Nature lover">
                </div>

                <div style="display:flex; gap:20px;">
                    <div class="form-group" style="flex:1;">
                        <label>Age</label>
                        <input type="number" id="edit-age" min="18">
                    </div>
                    <div class="form-group" style="flex:2;">
                        <label>City</label>
                        <input type="text" id="edit-city" placeholder="e.g. London">
                    </div>
                </div>

                <div style="margin: 40px 0; padding: 30px; background: #f8fafc; border-radius: 20px;">
                    <h3 style="margin-top:0; display:flex; align-items:center; gap:10px;"><i class="fas fa-comment-dots" style="color:#6366f1;"></i> Break the Ice</h3>
                    <div class="form-group">
                        <label>My perfect weekend starts with...</label>
                        <input type="text" id="edit-prompt-1" placeholder="e.g. A long hike and a great coffee.">
                    </div>
                    <div class="form-group">
                        <label>I'm looking for a buddy to...</label>
                        <input type="text" id="edit-prompt-2" placeholder="e.g. Master urban photography with me.">
                    </div>
                    <div class="form-group">
                        <label>A hobby I want to learn is...</label>
                        <input type="text" id="edit-prompt-3" placeholder="e.g. Surfing or Oil Painting.">
                    </div>
                </div>

                <div class="form-group">
                    <label>Select Hobbies (3-5)</label>
                    <div id="hobbies-grid" class="hobbies-grid"></div>
                </div>

                <div class="form-group">
                    <label>Profile Gallery (Image URLs)</label>
                    <div class="photo-grid" id="photo-grid"></div>
                </div>

                <div style="display:flex; justify-content:space-between; margin-top:50px;">
                    <button type="button" class="btn-danger-outline" id="btn-delete-account" style="color:#ef4444; border:1px solid #ef4444; background:none; padding:12px 24px; border-radius:12px; cursor:pointer;">Delete Account</button>
                    <button type="submit" class="btn-primary" style="background:#6366f1; color:white; border:none; padding:15px 40px; border-radius:12px; font-weight:700; cursor:pointer;" id="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/hobbybuddy.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('hb_token');
            const userId = localStorage.getItem('userId');
            if (!token) window.location.href = '/login';

            const API_BASE = window.location.hostname === 'localhost' ? '' : 'https://hobbybuddy-springboot.onrender.com';
            let selectedHobbies = new Set();
            const ALL_HOBBIES = ['Photography 📷', 'Hiking 🥾', 'Coding 💻', 'Running 🏃', 'Gaming 🎮', 'Music 🎵', 'Cooking 🍳', 'Travel ✈️', 'Reading 📚', 'Art 🎨', 'Fitness 💪', 'Board Games 🎲', 'Cinema 🎬', 'Dancing 💃', 'Yoga 🧘', 'Writing ✍️', 'Football ⚽', 'Tennis 🎾', 'Cycling 🚴', 'Volunteering 🤝'];

            async function loadProfile() {
                const res = await fetch(API_BASE + '/api/users/me');
                const user = await res.json();
                
                document.getElementById('edit-name').value = user.name || '';
                document.getElementById('edit-tagline').value = user.personalityTagline || '';
                document.getElementById('edit-age').value = user.age || '';
                document.getElementById('edit-city').value = user.city || '';
                document.getElementById('edit-prompt-1').value = user.prompt1 || '';
                document.getElementById('edit-prompt-2').value = user.prompt2 || '';
                document.getElementById('edit-prompt-3').value = user.prompt3 || '';
                
                selectedHobbies = new Set(user.hobbies ? user.hobbies.split(',').map(h => h.trim()) : []);
                renderHobbies();

                const photoGrid = document.getElementById('photo-grid');
                const photos = JSON.parse(user.photosJson || '[]');
                for(let i=0; i<4; i++) {
                    const div = document.createElement('div');
                    div.className = 'photo-input';
                    div.innerHTML = `<input type="text" class="photo-url" placeholder="Photo ${i+1} URL" value="${photos[i] || ''}" style="width:100%; padding:8px;">`;
                    photoGrid.appendChild(div);
                }
            }

            function renderHobbies() {
                const grid = document.getElementById('hobbies-grid');
                grid.innerHTML = '';
                ALL_HOBBIES.forEach(h => {
                    const chip = document.createElement('div');
                    chip.className = 'hobby-chip' + (selectedHobbies.has(h) ? ' selected' : '');
                    chip.textContent = h;
                    chip.onclick = () => {
                        if (selectedHobbies.has(h)) selectedHobbies.delete(h);
                        else if (selectedHobbies.size < 5) selectedHobbies.add(h);
                        renderHobbies();
                    };
                    grid.appendChild(chip);
                });
            }

            loadProfile();

            document.getElementById('profile-edit-form').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-save');
                btn.disabled = true;
                btn.textContent = 'Saving...';

                const photos = Array.from(document.querySelectorAll('.photo-url')).map(i => i.value).filter(v => v);
                
                const data = {
                    name: document.getElementById('edit-name').value,
                    personalityTagline: document.getElementById('edit-tagline').value,
                    age: parseInt(document.getElementById('edit-age').value),
                    city: document.getElementById('edit-city').value,
                    prompt1: document.getElementById('edit-prompt-1').value,
                    prompt2: document.getElementById('edit-prompt-2').value,
                    prompt3: document.getElementById('edit-prompt-3').value,
                    hobbies: Array.from(selectedHobbies).join(','),
                    photosJson: JSON.stringify(photos)
                };

                const res = await fetch(API_BASE + `/api/users/${userId}/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Profile updated!');
                    window.location.href = '/dashboard';
                } else {
                    alert('Error saving profile');
                    btn.disabled = false;
                    btn.textContent = 'Save Changes';
                }
            };
        });
    </script>
</body>
</html>
