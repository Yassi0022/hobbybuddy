<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1100" cy="500" r="250" fill="rgba(255,255,255,0.05)"/>
  <circle cx="600" cy="315" r="150" fill="rgba(255,255,255,0.03)"/>

  <!-- Main content -->
  <text x="600" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="72" font-weight="800" fill="white">HobbyBuddy</text>

  <text x="600" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.9)">Find Your Hobby Twin</text>

  <text x="600" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">AI-powered personality matching</text>

  <!-- Trait badges -->
  <rect x="250" y="380" width="140" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
  <text x="320" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">🧠 Curiosity</text>

  <rect x="420" y="380" width="140" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
  <text x="490" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">⚡ Drive</text>

  <rect x="590" y="380" width="160" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
  <text x="670" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">💬 Social Energy</text>

  <rect x="780" y="380" width="140" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
  <text x="850" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">🤝 Kindness</text>

  <!-- CTA -->
  <rect x="400" y="460" width="400" height="60" rx="30" fill="url(#accent)"/>
  <text x="600" y="498" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="700" fill="white">Take the Free Quiz →</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">hobbybuddy.app</text>
</svg>
