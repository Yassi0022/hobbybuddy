<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Sign in to HobbyBuddy and reconnect with your personality-matched hobby companions.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./images/icon-192.png">
    <title>HobbyBuddy - Sign In</title>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Sign In — HobbyBuddy">
    <meta property="og:description" content="Sign in to HobbyBuddy and reconnect with your personality-matched hobby companions.">
    <meta property="og:image" content="./images/og-card.svg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign In — HobbyBuddy">
    <meta name="twitter:description" content="Sign in to HobbyBuddy and reconnect with your personality-matched hobby companions.">
    <meta name="twitter:image" content="./images/og-card.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/icon-192.png">
    <link rel="apple-touch-icon" href="./images/icon-192.png">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/pages.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/overrides.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-mesh"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <nav class="navbar navbar-solid">
        <div class="nav-container">
            <a href="./" class="logo"><i class="fas fa-users"></i><span>HobbyBuddy</span></a>
            <ul class="nav-menu"><li><a href="./register.html" class="cta-button">Join Now</a></li></ul>
        </div>
    </nav>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-icon"><i class="fas fa-sign-in-alt"></i></div>
                <h1 class="auth-title">Welcome Back!</h1>
                <p class="auth-subtitle">Sign in to discover your new matches and messages</p>
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login-password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="login-password" placeholder="Your password" required autocomplete="current-password">
                    </div>
                    <div id="login-error" class="form-error" style="display:none;" role="alert"></div>
                    <button type="submit" class="btn-form-primary" id="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In Now</button>
                </form>
                <div class="auth-footer" style="padding-top: 20px;">Don't have an account yet? <a href="./register.html">Join now</a></div>
            </div>
        </div>
    </div>
    <!-- Google Translate Widget -->
    <div id="google_translate_element" style="position:fixed; bottom:20px; left:20px; z-index:9999;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src=".//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <footer style="padding: 40px 20px; text-align: center; border-top: 1px solid var(--color-border); margin-top: 40px; font-size: 0.85rem; color: var(--color-text-muted);">
        <div style="display: flex; justify-content: center; gap: 20px;">
            <a href="./privacy.html" style="color: inherit; text-decoration: none;">Privacy Policy</a>
            <a href="./terms.html" style="color: inherit; text-decoration: none;">Terms of Use</a>
        </div>
        <p style="margin-top: 10px;">&copy; 2026 HobbyBuddy. Matching friends by psychology.</p>
    </footer>
    <script src="./js/core/utils.js"></script>
    <script src="./js/core/navigation.js"></script>
    <script src="./js/core/dashboard.js"></script>
</body>
</html>
