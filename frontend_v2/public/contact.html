<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — HobbyBuddy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff8f5;color:#2d1810;padding:3rem 1.5rem;line-height:1.7}
h1{font-size:2.5rem;font-weight:800;color:#c2410c;margin-bottom:.5rem}
form{max-width:480px;background:#fff;padding:2rem;border-radius:16px;box-shadow:0 10px 30px rgba(194,65,12,0.08)}
label{display:block;margin-top:1rem;font-weight:600}
input,textarea{width:100%;padding:.75rem;margin-top:.25rem;border:1px solid #e6ddd5;border-radius:8px;font-family:inherit;font-size:1rem;background:#fff8f5}
button{margin-top:1.5rem;padding:.75rem 1.75rem;background:#c2410c;color:#fff;border:none;border-radius:999px;font-weight:600;cursor:pointer}
button:hover{background:#a3330b}
</style>
</head>
<body>
<h1>Contact Us</h1>
<p>Questions, feedback, or issues? Reach out — we respond within 24 hours.</p>
<form onsubmit="event.preventDefault(); this.innerHTML='<p style=\'font-weight:600;color:#2d1810\'>Thanks! Your message was sent. We will respond shortly.</p>';">
<label for="name">Name</label><input id="name" name="name" placeholder="Your name" required />
<label for="email">Email</label><input id="email" type="email" name="email" placeholder="you@example.com" required />
<label for="message">Message</label><textarea id="message" name="message" rows="4" placeholder="How can we help?" required></textarea>
<button type="submit">Send Message</button>
</form>
<p><a href="/">Back to Home</a></p>
</body>
</html>
