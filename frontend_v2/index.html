    <title>HobbyBuddy — Find Your People | Personality-First Friendship Matching</title>

    <style>
        :root{--bg:#fff8f5;--fg:#2d1810;--accent:#c2410c;--card:#fff;--shadow:rgba(194,65,12,0.08)}
        @media(prefers-color-scheme:dark){:root{--bg:#1a0d08;--fg:#f8eadd;--card:#2a140d;--shadow:rgba(194,65,12,0.15)}}
        html{scroll-behavior:smooth}
        body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:0;line-height:1.65}
        a{color:var(--accent);text-decoration:none}
        a:hover{text-decoration:underline}
        img{max-width:100%;display:block}
        .fade-in{animation:fadeIn .6s ease-out both}
        .slide-up{animation:slideUp .5s ease-out both}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        /* Skeleton */
        .skeleton{background:linear-gradient(90deg,#e6ddd5 25%,#f0ebe5 50%,#e6ddd5 75%);background-size:200% 100%;animation:skeleton 1.2s infinite ease-in-out;border-radius:8px}
        @keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}
        /* Toast */
        .toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.75rem 1.25rem;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 10px 25px var(--shadow);animation:slideUp .4s ease-out;z-index:9999}
        /* Error */
        .error-box{text-align:center;padding:3rem 1.5rem;background:var(--card);border-radius:16px;box-shadow:0 8px 30px var(--shadow)}
        .btn-hover:hover{transform:translateY(-2px);box-shadow:0 12px 30px var(--shadow);transition:all .2s ease}
        /* Dark mode toggle */
        .dark-toggle{position:fixed;top:1rem;right:1rem;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:.5rem 1rem;font-weight:600;cursor:pointer;z-index:10000}
        .dark-toggle:hover{opacity:.9}
        /* Mobile hamburger */
        .hamburger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:.5rem}
        .hamburger span{width:24px;height:3px;background:var(--fg);border-radius:2px;transition:.2s}
        @media(max-width:768px){.hamburger{display:flex}.nav-menu{display:none;position:absolute;top:3.5rem;left:0;right:0;background:var(--card);padding:1rem;box-shadow:0 10px 30px var(--shadow)}}
    </style>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" as="style" />
    <link rel="preload" href="/src/main.jsx" as="script" />

    <!-- Analytics: Plausible (privacy-first, GDPR-compliant) -->
    <script defer data-domain="hobbybuddy.app" src="https://plausible.io/js/script.tagged-events.outbound-links.js"></script>
</head>
<body>
    <div id="root"></div>
    <button class="dark-toggle" onclick="document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')" aria-label="Toggle dark mode">🌙</button>
    <script>
    if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');
    function validateEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}
    function showToast(msg,type='success'){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
